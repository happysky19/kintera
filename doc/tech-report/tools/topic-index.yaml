# Topic index data (Appendix F, written by tools/gen_topic_index.py before every render).
#
# `sections` maps every labelled `##` section of the book to the words a reader would look it up by. Each item
# is a term, or a one-key map `term: [aliases]`. A term that several sections share becomes one index line with
# a reference to each; "term, qualifier" sorts under the term. An alias prints as "alias, see term".
# Use the reader's words (the newcomer question bank), not code symbols; a key or symbol may be an alias.
# A chapter or appendix with no `##` sections of its own (the test index) may be listed under its `#` label.
#
# `unlabeled` lists the `##` headings that carry no label, so cannot be indexed, with the label that covers
# them. `.unlisted` part dividers need no row. tools/tests/test_topic_index.py fails when a section has no
# item, when a label here does not exist in the book, or when an unlabeled heading is not listed.
#
# The scaffold's labelled `##` sections are Appendix A's notation index and its symbol groups (the group titles of
# NOTATION.md).

sections:
  # Appendix A. Notation
  sec-appa-1:
    - symbols, coordinates and grids
  sec-appa-2:
    - symbols, state, thermodynamics and species
  sec-appa-2a:
    - symbols, species thermodynamics, phase change and reactions
  sec-appa-3:
    - symbols, fluxes and transport
  sec-appa-4:
    - symbols, operators and averages
  sec-appa-5:
    - symbols, gravity and potential energy
  sec-appa-6:
    - symbols, reference states
  sec-appa-7:
    - symbols, time integration and the implicit solver
  sec-appa-8:
    - symbols, diffusion
  sec-appa-8a:
    - symbols, radiation and photochemistry
  sec-appa-9:
    - symbols, diagnostics and errors
  sec-appa-10:
    - symbols, reserved letters
  sec-appa-index:
    - notation index: [symbol table]

  # Chapter 3. Equation of state and thermodynamic functions
  sec-ch03-species-state:
    - species order, gases then condensates
    - state vectors, mole fractions and mass fractions: [ThermoX, ThermoY, Y->X, X->Y]
    - conversions between mass and mole fractions
  sec-ch03-eos:
    - equation of state, ideal gas: [VT->P, PV->T, TPX->V]
    - compressibility factor: [czh]
    - pressure from density and temperature
    - temperature from pressure and density
  sec-ch03-caloric:
    - heat capacity, constant: [cv_R]
    - heat capacity, NASA-9 polynomial: [use-nasa9-cp]
    - heat capacity, hydrogen rotational: [use-h2-cp, h2-cp-mode, ortho-para]
    - internal energy of a species
    - temperature from internal energy: [VU->T]
    - enthalpy of a species
  sec-ch03-reference-state:
    - reference state: [Tref, Pref, u0_R, s0_R]
    - latent heat, from the energy offsets
    - Kirchhoff relation, latent heat and heat capacities
  sec-ch03-entropy:
    - entropy of a gas
    - entropy of a condensate, derived from the saturation curve
    - Gibbs free energy: [THS->G]
    - Helmholtz free energy: [TUS->F]
    - temperature from entropy and pressure: [PXS->T]
  sec-ch03-relative-humidity:
    - relative humidity: [saturation ratio, relative_humidity]
    - saturation ratio, with gaseous products: [ngas]
  sec-ch03-adiabat:
    - moist adiabat: [extrapolate_dlnp, extrapolate_dz]
    - effective heat capacity, with the latent term: [effective_cp]
    - pseudo-adiabat, rain-out: [rainout]

unlabeled:
  # the per-chapter fragments of Appendix B carry the chapter title as an unlabelled `##` heading (gen_derivation_index.py)
  - file: chapters/appendices/_appb-ch03.qmd
    heading: Equation of state and thermodynamic functions (@sec-ch03)
    covered-by: sec-appb
